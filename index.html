<section class="sec">
  <h2>費用の目安</h2>
  <p class="lead">家族4人。2026年10月の料金をもとにした試算で、2027年は変わる可能性がある。子供2人とも席を取る前提。</p>
  <div class="scroll-x">
    <table>
      <thead><tr><th>項目</th><th>内訳</th><th class="r">金額</th></tr></thead>
      <tbody>
        <tr><td>交通（JR）</td><td>往路 約7.1万円、復路 約7.3万円。2027年7月から、のぞみ・みずほの指定席が約500円上がる見込み</td><td class="r">約14〜14.5万円</td></tr>
        <tr><td>宿（おすすめ）</td><td>土佐御苑2泊 約4.9万円、ピュアリティまきび1泊 約1.7〜1.95万円</td><td class="r">約6.6〜6.9万円</td></tr>
        <tr><td>レンタカー</td><td>12時間 6,600円、チャイルドシート2台 3,300円、免責補償 1,100円、ガソリン 約1,500円</td><td class="r">約1.3万円</td></tr>
        <tr><td>入場料</td><td>ミュージアム 2,700円、のいち動物公園 940円、高知城 1,000円</td><td class="r">約0.5万円</td></tr>
        <tr class="total"><td colspan="2">合計（食事代・おみやげ代は別）</td><td class="r">約22〜23万円</td></tr>
      </tbody>
    </table>
  </div>
  <p class="cost-note">宿を「三翠園2泊＋岡山プラザホテル」の少し良い組み合わせにすると、宿が約11万円になり、合計は約27万円。交通費は、2026年10月の多くの金〜日曜が「繁忙期」（指定席が200円高い期間）だったため、繁忙期の料金で計算している。</p>
</section>
<section class="sec">
  <h2>気をつける点</h2>
  <ul class="list">
    <li><span class="head">割引の「レール＆レンタカーきっぷ」は終了している</span><span class="sub">2026年2月28日で終わった。2027年は使えない。往復割引も2026年3月に廃止された。<span class="tag plain">確定</span></span></li>
    <li><span class="head">アンパンマンミュージアムは日時指定の事前予約制</span><span class="sub">スマホのQRコードで入る。3連休などは売り切れて当日券が出ないことがある。何か月前から買えるかは、わからない。1歳の子には抱っこひもがあると安心<span class="tag plain">推測</span></span></li>
    <li><span class="head">琴平駅は、エレベーターの記載がない</span><span class="sub">JR四国の案内には、階段とスロープの記載だけで、エレベーターの記載がない。<span class="tag plain">確定</span> ベビーカーをたたんで抱っこで動く準備をして、予約の前に公式ページで確認する。<span class="tag plain">推測</span></span></li>
    <li><span class="head">南風の車内では、ベビーカーをたたむ</span><span class="sub">座席の近くに置く決まり。トロッコには置き場がある（数に限りあり）。</span></li>
    <li><span class="head">どの日にどの号数がアンパンマン列車か、まだわからない</span><span class="sub">JR西日本のページに「土曜や休日は編成が変わる号数がある」という注記がある。アンパンマン列車になる号数は毎日同じで、曜日で変わるのは編成らしい<span class="tag plain">推測</span> 初日の金曜は「平日」の編成。乗る日の時刻表で、必ず確認する。</span></li>
    <li><span class="head">博多の乗り換えは17分。エレベーターの経路は、わからない</span><span class="sub">岡山駅や博多駅の、新幹線と在来線のエレベーター経路は、公式で確認できなかった。駅員さんに、エレベーターのある経路を聞くと安心<span class="tag plain">推測</span> 岡山の乗り換え33分は余裕がある。</span></li>
    <li><span class="head">子供の運賃は、席を取ると子供料金</span><span class="sub">1〜5歳は「幼児」。席を使わなければ、大人1人につき2人まで無料。今回は2人とも席を取るので、2人分の子供料金がかかる。トロッコのグリーン券は、大人と同額（1,260円）。</span></li>
  </ul>
  <h3 class="group-title">予約の目安</h3>
  <div class="scroll-x">
    <table class="when">
      <tbody>
        <tr><td>今〜2027年春</td><td>宿の空室を時々見る。取れたら予約する（キャンセル料の条件も確認）。第一候補の宿には、電話で受付開始日を聞く</td></tr>
        <tr><td>2027年6月中旬〜下旬</td><td>トロッコの秋の運転日が発表される<span class="tag warn">予想</span></td></tr>
        <tr><td>2027年8月下旬</td><td>トロッコの秋の時刻が発表される<span class="tag warn">予想</span></td></tr>
        <tr><td>2027年9月15日 10:00</td><td>初日（10/15）の指定席の発売。以降、乗る日の1か月前の10:00に発売<span class="tag warn">予想</span></td></tr>
      </tbody>
    </table>
  </div>
</section>
<section class="sec">
  <h2>電話で聞くこと</h2>
  <p class="lead">調べても、公式で確認できなかった点。電話番号は、公式以外の掲載で見つけたもの<span class="tag plain">推測</span>。つながらないときは、公式サイトの問い合わせ先を使う。質問の全文は <code>research-followup.md</code> にある。</p>
  <ul class="list">
    <li><span class="head">琴平駅　0877-73-4171</span><span class="sub">駅の中にエレベーターやエスカレーターはあるか。南風10号とトロッコ4号は何番線か。階段だけのとき、ベビーカーを運ぶ手伝いはあるか。コインロッカーに、たたんだベビーカーは入るか。</span></li>
    <li><span class="head">アンパンマンミュージアム　0887-59-2300</span><span class="sub">入館券は何か月前から買えるか。ウェブで時間を予約したあと、入館券は事前に買うのか、当日に買うのか。3歳未満は枠に数えられるか。朝9:30の枠は、いつ売り切れるか。</span></li>
    <li><span class="head">土佐御苑・ピュアリティまきび　番号は公式サイトで確認</span><span class="sub">予約はいつから受け付けるか。添い寝の条件と、3歳の料金区分。ベビーベッド・ベビーガードの貸出。10/16に高知から宅配便で荷物を送り、10/17に岡山で受け取れるか。10/18のチェックアウト後に、荷物を預かってもらえるか。</span></li>
    <li><span class="head">金刀比羅宮　0877-75-2121</span><span class="sub">参道に、授乳やおむつ替えができる場所はあるか。ベビーカーを預かってもらえる場所はあるか。</span></li>
  </ul>
</section>
<section class="sec">
  <h2>当日の持ち物</h2>
  <p class="lead">調査の注意点と、一般的な子連れ旅行の定番をまとめた候補<span class="tag plain">推測</span>。足りないものは、家族で足していく。</p>
  <ul class="pack">
    <li>ベビーカー</li>
    <li>抱っこひも（ミュージアム・琴平用）</li>
    <li>おむつ・おしりふき・着替え</li>
    <li>離乳食・おやつ・飲み物</li>
    <li>ミュージアムのQRコード（スマホ）</li>
    <li>乗車券・指定席券（e5489の画面）</li>
    <li>レンタカーの予約票（チャイルドシート2台）</li>
    <li>おもちゃ・絵本（長い電車用）</li>
    <li>雨具・羽織るもの（10月の朝晩用）</li>
  </ul>
</section>
